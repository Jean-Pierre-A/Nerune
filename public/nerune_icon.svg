<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <rect width="100" height="100" fill="#050810"/>
  <!-- Bottle cap -->
  <rect x="42" y="8" width="16" height="8" rx="2" fill="none" stroke="#8899bb" stroke-width="1.5"/>
  <!-- Bottle neck connector -->
  <line x1="50" y1="16" x2="50" y2="26" stroke="#8899bb" stroke-width="1.5"/>
  <!-- Bottle body (house/pentagon shape) -->
  <path d="M30,38 L50,26 L70,38 L70,72 L30,72 Z" fill="#0d1929"/>
  <path d="M30,38 L50,26 L70,38 L70,72 L30,72 Z" fill="none" stroke="#8899bb" stroke-width="1.5"/>
  <!-- Liquid fill area -->
  <path d="M30,60 L30,72 L70,72 L70,60 Z" fill="#1a2e4a"/>
  <!-- Liquid fill line -->
  <line x1="30" y1="60" x2="70" y2="60" stroke="#2a4a7a" stroke-width="1.5"/>
</svg>
